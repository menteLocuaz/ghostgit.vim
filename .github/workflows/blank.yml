name: Test Runner

on:
  push:
    branches: [ "main", "test-1" ]
  pull_request:
    branches: [ "main", "test-1" ]

jobs:
  test:
    name: ${{ matrix.runner }} / ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: vim
            version: v9.0.0
          - runner: vim
            version: master
          - runner: nvim
            version: v0.9.0
          - runner: nvim
            version: nightly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vader.vim
        run: |
          git clone --depth 1 https://github.com/junegunn/vader.vim.git /tmp/vader.vim

      - name: Setup Vim/Neovim
        uses: thinca/action-setup-vim@v1
        with:
          vim_version: ${{ matrix.runner == 'vim' && matrix.version || '' }}
          nvim_version: ${{ matrix.runner == 'nvim' && matrix.version || '' }}

      - name: Run Vader tests
        run: |
          if [ "${{ matrix.runner }}" = "nvim" ]; then
            nvim --headless -c "set rtp+=/tmp/vader.vim" -c "set rtp+=$(pwd)" -c "Vader! test/specs/*.vader" -c "qall!"
          else
            vim -u NONE -i NONE -n -e -s -c "set rtp+=/tmp/vader.vim" -c "set rtp+=$(pwd)" -c "Vader! test/specs/*.vader" -c "qall!"
          fi
